name: Deploy UI

on:
  push:
    branches: [master, supplier-dashboard-ui-match]
  workflow_dispatch:

concurrency:
  group: deploy-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload UI to the API site
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow no; set ftp:passive-mode true; set mirror:parallel-transfer-count 4; open -u '${FTP_USER}','${FTP_PASSWORD}' ${FTP_HOST}; mirror -R --no-perms --no-symlinks ./dist/Smart-Spaza-UI/browser /wwwroot/wwwroot"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://smartspaza-api.runasp.net/login || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "UI did not come back up"
          exit 1
